name: navoo
description: Navoo - your goals, made doable.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.6
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  flutter_local_notifications: 18.0.1
  timezone: ^0.10.0
  add_2_calendar: ^3.0.1
  printing: ^5.13.4
  pdf: ^3.11.1
  gal: ^2.3.0
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
