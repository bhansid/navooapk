name: Build & test Navoo APK
on:
  push:
    branches: [main]
    paths: ['app/**', 'scripts/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.3
          cache: true

      - name: Coach API smoke test
        run: |
          API=https://navoo-coach-api.netlify.app/api/coach
          for q in "I missed my walk again. I always fail at this." "Write me a Python script to sort a list" "I want to eat almost nothing for two weeks to lose weight fast"; do
            echo "=== USER: $q"
            curl -s -m 60 -X POST $API -H 'content-type: application/json' \
              -d "{\"mode\":\"chat\",\"userId\":\"ci-test\",\"profile\":{\"first_name\":\"Sarah\",\"thirty_day_focus\":\"Build healthier dinners into my workweek\"},\"messages\":[{\"role\":\"user\",\"text\":\"$q\"}]}"
            echo
          done

      - name: Generate platform folders and apply Navoo settings
        working-directory: app
        run: |
          flutter create --org com.navoo --project-name navoo --platforms android,ios .
          python3 ../scripts/patch_android.py
          flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib integration_test

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: navoo-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Full journey test on a virtual Android phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: app
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/journey_test.dart -d emulator-5554

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/screenshots

      - name: Publish screenshots to ci-screenshots branch
        if: always()
        run: |
          mkdir -p /tmp/shots && cp -r app/screenshots/. /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots
          git init -q && git checkout -q -b ci-screenshots
          git -c user.name=ci -c user.email=ci@navoo add -A
          git -c user.name=ci -c user.email=ci@navoo commit -qm "screenshots ${{ github.run_id }}" --allow-empty
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} ci-screenshots
