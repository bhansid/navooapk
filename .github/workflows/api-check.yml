name: Coach API check
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy coach API"]
    types: [completed]
jobs:
  check:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for the new deploy to go live
        run: sleep 45
      - name: Cloud test of the live coach
        run: node server/test/cloud-test.mjs
